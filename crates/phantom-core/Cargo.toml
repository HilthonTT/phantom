[package]
name = "phantom-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

# jemalloc and its optional add-ons. The allocator itself is a C library, so the
# dependencies are optional and never pulled in on targets that skip `alloc::je`.
jemalloc = [
    "dep:ctor",
    "dep:tikv-jemalloc-ctl",
    "dep:tikv-jemalloc-sys",
    "dep:tikv-jemallocator",
]
jemalloc_conf = ["jemalloc", "dep:const-str"]
jemalloc_prof = ["jemalloc", "tikv-jemalloc-ctl?/profiling", "tikv-jemalloc-sys?/profiling"]
jemalloc_stats = [
    "jemalloc",
    "tikv-jemalloc-ctl?/stats",
    "tikv-jemalloc-sys?/stats",
    "tikv-jemallocator?/stats",
]

hardened_malloc = ["dep:hardened_malloc-rs"]

[dependencies]
argon2 = "0.5.3"
arrayvec = "0.7.8"
# axum lands in core because `impl IntoResponse for Error` must live in the
# crate that defines Error; the orphan rule leaves it no other home.
axum = { version = "0.8.7", default-features = false }
axum-extra = { version = "0.12.6", default-features = false, features = ["typed-header"] }
bytes = "1.10.1"
bytesize = "2.7.0"
checked = "0.5.0"
checked_ops = "0.1.0"
chrono = "0.4.45"
core_affinity = "0.8.3"
cyborgtime = "2.1.1"
either = { version = "1.18.0", features = ["serde"] }
figment = { version = "0.10.19", default-features = false, features = ["env", "toml"] }
futures = "0.3.34"
hash = "0.3.0"
http = "1.3.1"
http-body-util = "0.1.3"
js_int = "0.2.2"
libc = "0.2.189"
num-traits = "0.2.19"
phantom-macros.workspace = true
rand = "0.10.2"
regex = "1.13.1"
# rustls rather than the default native-tls so proxying does not drag in a
# system OpenSSL; `socks` is what makes `socks5h://` proxy URLs work.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "socks"] }
ring = "0.17.14"
ruma = { version = "0.16.0", features = [
    "api",
    "client-api",
    "events",
    "signatures",
    "state-res",
] }
sanitize-filename = "0.6.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.151"
serde_regex = "1.1.0"
thiserror = "2.0.20"
tokio = { version = "1.49.0", default-features = false, features = ["rt"] }
tokio-metrics = "0.5.1"
toml = "1.1.4"
tracing = "0.1.44"
tracing-core = "0.1.36"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# `#[tokio::test]` and a runtime to drive the async tests; `time` for the tests
# that need two futures to finish out of order, and `rt-multi-thread` for the
# ones that hand work to the blocking pool. The library itself only needs the
# runtime handle.
tokio = { version = "1.49.0", default-features = false, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "time",
] }

[lints]
workspace = true

# jemalloc and hardened_malloc are C libraries with no MSVC support, mirroring
# the cfg gates in `alloc`. Declaring the optional deps here rather than in
# [dependencies] means the `jemalloc*` features stay selectable on every host —
# on MSVC they simply resolve to nothing, so enabling them in an editor or CI
# config does not drag in a build script that cannot run.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
const-str = { version = "1.1.0", optional = true }
ctor = { version = "1.0.13", optional = true }
hardened_malloc-rs = { version = "0.1.2", optional = true, default-features = false, features = ["static", "gcc", "light"] }
tikv-jemalloc-ctl = { version = "0.7.0", optional = true }
tikv-jemalloc-sys = { version = "0.7.1", optional = true }
tikv-jemallocator = { version = "0.7.0", optional = true }
