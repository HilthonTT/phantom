[package]
name = "phantom-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

# jemalloc and its optional add-ons. The allocator itself is a C library, so the
# dependencies are optional and never pulled in on targets that skip `alloc::je`.
jemalloc = [
    "dep:ctor",
    "dep:tikv-jemalloc-ctl",
    "dep:tikv-jemalloc-sys",
    "dep:tikv-jemallocator",
]
jemalloc_conf = ["jemalloc", "dep:const-str"]
jemalloc_prof = ["jemalloc", "tikv-jemalloc-ctl?/profiling", "tikv-jemalloc-sys?/profiling"]
jemalloc_stats = [
    "jemalloc",
    "tikv-jemalloc-ctl?/stats",
    "tikv-jemalloc-sys?/stats",
    "tikv-jemallocator?/stats",
]

hardened_malloc = ["dep:hardened_malloc-rs"]

[dependencies]
argon2 = "0.5.3"
arrayvec = "0.7.8"
futures = "0.3.34"
hash = "0.3.0"
rand = "0.10.2"
ring = "0.17.14"
thiserror = "2.0.20"
tracing = "0.1.44"

[lints]
workspace = true

# jemalloc and hardened_malloc are C libraries with no MSVC support, mirroring
# the cfg gates in `alloc`. Declaring the optional deps here rather than in
# [dependencies] means the `jemalloc*` features stay selectable on every host —
# on MSVC they simply resolve to nothing, so enabling them in an editor or CI
# config does not drag in a build script that cannot run.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
const-str = { version = "1.1.0", optional = true }
ctor = { version = "1.0.13", optional = true }
hardened_malloc-rs = { version = "0.1.2", optional = true, default-features = false, features = ["static", "gcc", "light"] }
tikv-jemalloc-ctl = { version = "0.7.0", optional = true }
tikv-jemalloc-sys = { version = "0.7.1", optional = true }
tikv-jemallocator = { version = "0.7.0", optional = true }
