[package]
name = "phantom-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# http2 on top of axum's defaults: federation peers and reverse proxies may
# speak it over the plain listener.
axum = { version = "0.8.9", features = ["http2"] }
clap = { version = "4.6.10", features = ["derive", "env"] }
figment = { version = "0.10.19", default-features = false, features = ["env", "toml"] }
futures = "0.3.34"
opentelemetry = { version = "0.33.0", optional = true }
opentelemetry-otlp = { version = "0.33.0", optional = true }
opentelemetry_sdk = { version = "0.33.0", optional = true }
phantom-api.workspace = true
phantom-core.workspace = true
phantom-service.workspace = true
# Inbound TLS when `[global.tls]` is set. ring is named as the provider
# explicitly; see `tls::server_config`.
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "ring", "tls12"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-flame = { version = "0.2.0", optional = true }
# 0.34 is the release built against opentelemetry 0.33; the two must move together.
tracing-opentelemetry = { version = "0.34.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# The end-to-end tests drive a spawned server over HTTP. Both are already in
# the lockfile through phantom-service and phantom-database, so they bring no
# new crate in. `rustls-tls` because the federation test's servers speak TLS
# with a self-signed certificate.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tempfile = "3.27.0"

[features]
perf_measurements = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-flame",
    "dep:tracing-opentelemetry",
]

[lints]
workspace = true
