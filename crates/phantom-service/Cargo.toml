[package]
name = "phantom-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

# Widens lazy-loading to resend membership events the client has already been
# told about. Element relies on being sent them again where the spec says it
# need not be; off by default, since it costs bandwidth on every sync.
element_hacks = []

# Tells the service manager to notify systemd when the server is reloading its
# config and when it is ready again, so a `Type=notify` unit does not consider
# the reload finished before it is.
systemd = ["dep:sd-notify"]

url_preview = ["dep:image", "dep:webpage"]

# `tokio/process` runs the video thumbnail program and `tokio/io-util` drains
# its pipes; neither is wanted in a build that cannot thumbnail.
media_thumbnail = ["dep:image", "dep:libc", "tokio/io-util", "tokio/process"]

[dependencies]
# `serde` so a resolved destination's port string is stored as it stands.
arrayvec = { version = "0.7.8", features = ["serde"] }
# The queues between the sender's dispatchers and its workers. Chosen over
# tokio's mpsc because the receiving end is cloned when a worker starts.
async-channel = "2.5.0"
# The response body a federation request is read into; `reqwest` hands one
# back and ruma reads the typed response out of it, so it is named here.
bytes = "1.12.1"
# `Service` has async methods and is used behind `dyn`, which the language
# cannot yet express on its own.
async-trait = "0.1.92"
either = "1.18.0"
futures = "0.3.34"
# The resolver drives hickory directly rather than through reqwest's own
# integration: resolving a Matrix server name is not a plain A/AAAA lookup,
# and the SRV and well-known steps need the resolver on their own terms.
hickory-resolver = { version = "0.26.1", default-features = false, features = [
    "system-config",
    "tokio",
] }
# CIDR containment, for `ip_range_denylist`.
ipaddress = "0.1.3"
lru-cache = "0.1.2"
phantom-core.workspace = true
phantom-database.workspace = true
regex = "1.13.1"
# `rustls-tls` for the same reason as phantom-core's copy: no system OpenSSL.
# The three codecs are what the `*_compression` config options switch on.
reqwest = { version = "0.12.28", default-features = false, features = [
    "brotli",
    "gzip",
    "rustls-tls",
    "socks",
    "zstd",
] }
# `client-api` for the room directory's `Visibility`. Workspace feature
# unification would supply it through phantom-core either way; it is spelled
# here because this crate is the one that uses it.
# `push-gateway-api-c` is the sending half only: the server posts
# notifications to a gateway and never serves the endpoint itself.
# `unstable-msc4186` is sliding sync (`/sync` v5). The endpoint is not stable
# in the spec, but it is what current clients use for their room list, and the
# sync service holds the per-connection state it is defined in terms of.
ruma = { version = "0.17.0", features = [
    "client-api",
    "appservice-api",
    "federation-api",
    "push-gateway-api-c",
    "unstable-msc4186",
] }
sd-notify = { version = "0.5.0", optional = true, default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Inline buffers for the EDU JSON a sending transaction carries; most fit in
# the inline capacity, so a queued EDU costs no heap allocation. `write` so
# serde_json can serialize straight into one.
smallvec = { version = "1.15.2", features = ["write"] }
# `macros` for `select!` in the manager loop, `rt` for the tasks the workers
# run in, `sync` for the mutexes the manager's state lives behind, and `time`
# for the delay before a panicked worker is restarted.
# `fs` for the media store, whose files are read and written off the tokio
# worker threads rather than blocking one of them.
tokio = { version = "1.49.0", default-features = false, features = [
    "fs",
    "macros",
    "rt",
    "sync",
    "time",
] }
# The `#[instrument]` attribute on the worker frame; the log macros reach
# tracing through phantom-core's re-export.
tracing = "0.1.44"
base64 = "0.23.1"
# ECDSA on P-256 for the OIDC server's signing key: generating it, publishing
# its public half as a JWK, and signing the ID tokens. Already what
# phantom-core hashes with, so no second crypto backend comes with it.
ring = "0.17.14"
# `application/x-www-form-urlencoded` bodies, which is how OAuth 2 posts to a
# provider's token and revocation endpoints.
serde_html_form = "0.4.1"
webpage = { version = "2.0.1", optional = true }
image = { version = "0.25.10", optional = true }
# `serde` for the media type a URL preview carries, which is stored and
# served as a string but is short enough to live inline.
smallstr = { version = "0.3.1", features = ["serde"] }
# `Host`, which reqwest's re-export of `Url` does not carry: a preview URL
# whose host is an IP literal is screened against the CIDR denylist by value.
url = "2.5.7"
serde_bytes = "0.11.19"
lettre = { version = "0.11.23", features = ["tokio1", "tokio1-native-tls"] }
loole = "0.4.1"
http = "1.5.0"

# `killpg`, so that a video thumbnail program overrunning its deadline cannot
# leave behind whatever a wrapper script spawned. Only reachable through the
# thumbnailer, hence optional, and only on unix, where process groups exist.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.189", optional = true }

[lints]
workspace = true
