[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/HilthonTT/phantom"

[workspace.dependencies]
phantom-core = { path = "crates/phantom-core" }
phantom-database = { path = "crates/phantom-database" }
phantom-macros = { path = "crates/phantom-macros" }

[workspace.lints.rust]
unsafe_code = "warn"

# These cfg names come from RUSTFLAGS rather than Cargo features, so check-cfg
# has to be told they are expected or every use of one warns.
#
# `tokio_unstable` gates tokio's unstable runtime metrics. `unabridged` opts
# into the tracing instrumentation that is too noisy to carry by default.
# `phantom_bench` gates the `#[bench]` suites, which need a nightly compiler.
# `disable` is deliberately never set: it parks an alternative definition next
# to the one in use without compiling it.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(tokio_unstable)',
    'cfg(unabridged)',
    'cfg(phantom_bench)',
    'cfg(disable)',
] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `result::result` and friends: a module named for the type it defines reads
# fine inside a parent that groups extensions to that type.
module_inception = { level = "allow", priority = 1 }

[profile.release]
lto = "thin"
codegen-units = 1
