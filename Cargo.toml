[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/HilthonTT/phantom"

[workspace.dependencies]
phantom-core = { path = "crates/phantom-core" }
phantom-macros = { path = "crates/phantom-macros" }

[workspace.lints.rust]
unsafe_code = "warn"

# `tokio_unstable` comes from RUSTFLAGS rather than a Cargo feature — tokio's
# unstable runtime metrics are gated on it — so check-cfg has to be told the
# name is expected, otherwise every `#[cfg(tokio_unstable)]` warns.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `result::result` and friends: a module named for the type it defines reads
# fine inside a parent that groups extensions to that type.
module_inception = { level = "allow", priority = 1 }

[profile.release]
lto = "thin"
codegen-units = 1
