name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      # TODO: goreleaser release --clean (needs .goreleaser.yaml)

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: build and push image to ghcr.io/hilthontt/phantom
