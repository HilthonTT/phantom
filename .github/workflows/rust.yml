name: rust

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".github/workflows/rust.yml"

# Every step below only reads the tree. Nothing here publishes, so the job's
# token has no reason to be able to write one.
permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A deadlocked test would otherwise sit here until the job's own limit,
    # which is six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `--locked` on everything that resolves: the lockfile is committed, so a
      # manifest change that arrives without its lockfile update should stop
      # here. Without the flag cargo just resolves a fresh set, and CI ends up
      # certifying a dependency graph that nobody has locally.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The optional features are not in the default set, so nothing above
      # compiles them. Without this they rot: a dependency bump or a config
      # refactor breaks a feature-gated call site and no job notices.
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --all-features
