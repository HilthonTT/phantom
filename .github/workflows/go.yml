name: go

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "cli/**"
      - ".golangci.yml"
      - ".github/workflows/go.yml"

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cli

jobs:
  check:
    runs-on: ubuntu-latest
    # The same reasoning as the Rust job: a `go test -race` deadlock holds the
    # runner until the six-hour job limit unless something shorter ends it. The
    # Go tree is small enough that a healthy run is nowhere near this.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: cli
      - run: go test -race ./...
